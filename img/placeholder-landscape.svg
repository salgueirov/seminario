<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#A8D5BA" opacity="0.3"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#FAF8F2" opacity="0.6"/>
  
  <!-- Stylized illustration of open book under tree branches -->
  <g transform="translate(400, 230)">
    <!-- Tree branches -->
    <path d="M-150 -120 Q-80 -160 0 -130 Q80 -160 150 -120 Q200 -80 180 -20 Q100 -50 0 -30 Q-100 -50 -180 -20 Q-200 -80 -150 -120 Z" fill="#4A7C59" opacity="0.8"/>
    <circle cx="-100" cy="-100" r="45" fill="#4A7C59" opacity="0.9"/>
    <circle cx="0" cy="-120" r="55" fill="#4A7C59" opacity="0.95"/>
    <circle cx="100" cy="-100" r="45" fill="#4A7C59" opacity="0.9"/>
    <circle cx="-50" cy="-80" r="35" fill="#F4A259" opacity="0.8"/>
    <circle cx="60" cy="-80" r="30" fill="#A8D5BA"/>

    <!-- Open book -->
    <path d="M-120 40 Q-60 20 0 35 Q60 20 120 40 L120 120 Q60 100 0 115 Q-60 100 -120 120 Z" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="3"/>
    <path d="M0 35 L0 115" stroke="#2D2D2D" stroke-width="3"/>
    <path d="M-100 55 Q-50 40 -15 50" stroke="#4A7C59" stroke-width="3" stroke-linecap="round"/>
    <path d="M-100 75 Q-50 60 -15 70" stroke="#4A7C59" stroke-width="3" stroke-linecap="round"/>
    <path d="M-100 95 Q-50 80 -15 90" stroke="#4A7C59" stroke-width="3" stroke-linecap="round"/>
    
    <path d="M15 50 Q50 40 100 55" stroke="#4A7C59" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 70 Q50 60 100 75" stroke="#4A7C59" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 90 Q50 80 100 95" stroke="#4A7C59" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="400" y="420" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#2D2D2D" text-anchor="middle" opacity="0.7">Biblioteca Popular Del otro lado del árbol</text>
</svg>
